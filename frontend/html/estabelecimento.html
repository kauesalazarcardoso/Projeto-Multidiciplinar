<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Lovers Açaí</title>
  <link rel="stylesheet" href="../css/estabelecimento.css">
  <script>
    if (!localStorage.getItem('authToken')) {
      location.href = 'login.html?next=estabelecimento.html';
    }
  </script>
</head>
<body>
  <header class="header">
    <h1>🏪 Painel do Estabelecimento</h1>
    <div class="header-acoes">
      <button class="btn-limpar" id="btn-notif" onclick="ativarNotificacoes()">🔔 Ativar notificações</button>
      <button class="btn-limpar" id="btn-historico" onclick="toggleHistorico()">📜 Histórico (7 dias)</button>
      <button class="btn-limpar" onclick="limparEntregues()">Limpar Entregues/Recusados</button>
      <button class="btn-limpar" onclick="logout()">Sair</button>
    </div>
  </header>
  <div class="container">
    <div id="vendas-semana" class="vendas-semana"></div>
    <div id="secao-historico" class="lista-historico"></div>
    <div id="lista-pedidos"></div>
  </div>
  <script src="../js/auth.js"></script>
  <script src="../js/estabelecimento.js"></script>
</body>
</html>
