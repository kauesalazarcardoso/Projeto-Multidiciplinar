name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/738933484701/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@loversacai.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy acai-express-backend \
            --source=./backend \
            --project=loversacai \
            --region=us-east1 \
            --allow-unauthenticated \
            --max-instances=3 \
            --concurrency=8 \
            --set-env-vars="TZ=America/Sao_Paulo,VAPID_PUBLIC_KEY=BFuan3U92UOwmTmJEFJT88aoARZTpjZ76PY4zK3p5lxYMJ65zK21A-Xd9fMuG7d_GH8q6m6OSi86zHyP8PWXEc4,VAPID_CONTATO=mailto:kauesalazarcardoso123@gmail.com" \
            --set-secrets="DATABASE_URL=database-url:latest,GEMINI_API_KEY=gemini-api-key:latest,VAPID_PRIVATE_KEY=vapid-private-key:latest" \
            --quiet
